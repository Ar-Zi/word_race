<div id="word-game">
<style>
#word-game{font-family:system-ui,sans-serif;--navy:#14243c;--blue:#315f8f;--teal:#14766d;--ink:#172033;--border:#cfd8e5;max-width:980px;margin:auto;padding:16px;background:#edf2f7;color:var(--ink);border-radius:18px;position:relative}#word-game *{box-sizing:border-box}.board{display:grid;grid-template-columns:1fr 300px 1fr;grid-template-rows:auto auto;gap:12px}.panel,.letters,.controls{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;box-shadow:0 4px 12px rgba(20,36,60,.06)}.panel{grid-row:1/3;min-height:446px;display:flex;flex-direction:column}.player1{grid-column:1}.player2{grid-column:3}.letters{grid-column:2;grid-row:1}.controls{grid-column:2;grid-row:2;width:300px}.head{display:flex;justify-content:space-between;font-weight:800;color:var(--navy)}.text{margin-top:10px;flex:1;min-height:180px;padding:10px;background:#f8fafc;border:1px solid #e1e7ef;border-radius:9px;white-space:pre-wrap;overflow-wrap:anywhere;color:#26354a}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.char,.action{border-radius:8px;font-weight:800;cursor:pointer}.char{min-width:0;padding:6.75px 5px;border:1px solid #cbd6e3;background:#f4f7fa;color:var(--navy);box-shadow:0 2px #d6dee8}.char:hover:not(:disabled){background:#e8eff7;border-color:#8ca4bf}.char:disabled,.action:disabled{opacity:.4;cursor:not-allowed}.space{grid-column:span 4;font-size:12px;letter-spacing:.08em}.control-layout{display:grid;grid-template-columns:1fr 108px;gap:10px;align-items:center}.dice-side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:184px}.die{width:112px;height:112px;border:3px solid var(--navy);border-radius:20px;display:grid;place-items:center;font-size:50px;font-weight:900;background:#fff;color:var(--navy);box-shadow:inset 0 0 0 6px #edf2f7,0 4px 10px rgba(20,36,60,.12)}.turn{color:var(--navy);font-size:14px;text-align:center}.remaining{color:#667085;font-size:12px;text-align:center}.buttons{display:flex;flex-direction:column;gap:8px}.action{width:100%;min-height:38px;padding:8px;border:1px solid #d3dbe5;background:#e8edf3;color:#344054}.action:hover:not(:disabled){filter:brightness(.96)}.dice{background:var(--navy);border-color:var(--navy);color:#fff}.done{background:var(--teal);border-color:var(--teal);color:#fff}.meter{height:7px;background:#e2e8f0;border-radius:10px;margin-top:7px;overflow:hidden}.meter span{display:block;height:100%;background:var(--blue);width:0}.player2 .meter span{background:var(--teal)}button:focus-visible,input:focus-visible{outline:3px solid rgba(49,95,143,.3);outline-offset:2px}.setup{position:absolute;inset:16px;z-index:5;display:grid;place-items:center;background:rgba(237,242,247,.96);border-radius:14px}.setup-card{width:min(100%,360px);padding:22px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 14px 35px rgba(20,36,60,.18)}.setup-card h2{margin:0 0 6px;color:var(--navy);text-align:center}.setup-card p{margin:0 0 18px;color:#667085;font-size:13px;text-align:center}.field{display:block;margin-bottom:13px;color:var(--navy);font-size:13px;font-weight:800}.field input{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid #cbd6e3;border-radius:8px;color:var(--ink);background:#fff;font:inherit}.start{width:100%;padding:11px;border:0;border-radius:8px;background:var(--navy);color:#fff;font-weight:800;cursor:pointer}.setup-error{min-height:18px;margin-top:8px;color:#b42318;font-size:12px;text-align:center}@media(max-width:760px){.board{grid-template-columns:1fr;grid-template-rows:auto}.letters,.controls,.player1,.player2{grid-column:1;grid-row:auto}.letters{order:1}.player1{order:2}.controls{order:3;width:100%;max-width:300px;margin:auto}.player2{order:4}.panel{min-height:166px}.text{min-height:110px}}@media(prefers-color-scheme:dark){#word-game{background:#101827;color:#eef3fa;--border:#3a485c}.panel,.letters,.controls,.setup-card{background:#1a2536}.head,.turn,.setup-card h2,.field{color:#eef3fa}.text,.char,.die,.field input{background:#111b2a;color:#eef3fa;border-color:#415066}.char{box-shadow:0 2px #334156}.action{background:#2b384b;color:#eef3fa}.dice{background:#315f8f}.done{background:#14766d}.setup{background:rgba(16,24,39,.96)}}
</style>
<div class="setup" id="setup"><form class="setup-card" id="form"><h2>Choose player names</h2><p>Enter both names to start the game.</p><label class="field">Player 1<input id="name1" maxlength="20" value="Player 1" autocomplete="off"></label><label class="field">Player 2<input id="name2" maxlength="20" value="Player 2" autocomplete="off"></label><button class="start" type="submit">Start game</button><div class="setup-error" id="error" aria-live="polite"></div></form></div>
<div class="board">
<section class="panel player1"><div class="head"><span id="label1">Player 1</span><span id="score1">0 points</span></div><div class="meter"><span id="meter1"></span></div><div class="text" id="text1">Your text appears here...</div></section>
<section class="letters"><div class="grid" id="grid"></div></section>
<section class="panel player2"><div class="head"><span id="label2">Player 2</span><span id="score2">0 points</span></div><div class="meter"><span id="meter2"></span></div><div class="text" id="text2">Your text appears here...</div></section>
<section class="controls"><div class="control-layout"><div class="dice-side"><div class="die" id="die">–</div><strong class="turn" id="turn">Player 1's turn</strong><span class="remaining" id="remaining">100 points remaining</span></div><div class="buttons"><button class="action" id="new" type="button">New</button><button class="action" id="repeat" type="button" disabled>Repeat</button><button class="action dice" id="dice" type="button">Dice</button><button class="action done" id="done" type="button" disabled>Done</button></div></div></section>
</div>
<script>
(()=>{const root=document.getElementById('word-game');if(root.dataset.ready)return;root.dataset.ready='1';const $=s=>root.querySelector(s),grid=$('#grid');let names=['Player 1','Player 2'],texts=['',''],active=0,roll=0,left=0,picked=[],over=false,started=false;const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').concat(['SPACE','.',',','!','?','’']);const dictionary=new Set(('a i am an and are as at be before brown can clear correct dog english first fox fun game good has have he her his in is it jumps language lazy learning make more on or over player plays quick race sentence she space text the their they this to turn valid we win winner with word words write you your').split(' '));function sentenceCase(text){let cap=true;return[...text.toLowerCase()].map(ch=>{if(/[a-z]/.test(ch)){const out=cap?ch.toUpperCase():ch;cap=false;return out}if(/[.!?]/.test(ch))cap=true;return ch}).join('')}function words(text){return text.replace(/_/g,' ').toLowerCase().match(/[a-z]+/g)||[]}function valid(text){const list=words(text);return list.length>0&&list.every(w=>dictionary.has(w))}function pool(){return Math.max(0,100-texts[0].length-texts[1].length)}chars.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='char'+(x==='SPACE'?' space':'');b.textContent=x;b.setAttribute('aria-label',x==='SPACE'?'Add a space':`Add ${x}`);b.addEventListener('click',()=>add(x));grid.appendChild(b)});function letters(on){grid.querySelectorAll('button').forEach(b=>b.disabled=!on)}function update(){$('#label1').textContent=names[0];$('#label2').textContent=names[1];$('#text1').textContent=texts[0]?sentenceCase(texts[0]):'Your text appears here...';$('#text2').textContent=texts[1]?sentenceCase(texts[1]):'Your text appears here...';$('#score1').textContent=texts[0].length+' points';$('#score2').textContent=texts[1].length+' points';$('#meter1').style.width=texts[0].length+'%';$('#meter2').style.width=texts[1].length+'%';if(!over){$('#turn').textContent=names[active]+"'s turn";$('#remaining').textContent=pool()+' points remaining'+(roll?' • '+left+' choices left':'')}$('#repeat').disabled=!picked.length||over||!started;$('#done').disabled=!roll||over||!started;$('#dice').disabled=!!roll||over||pool()===0||!started;letters(!!roll&&left>0&&!over&&pool()>0&&started)}function finish(){if(pool()>0)return false;over=true;const v=[valid(texts[0]),valid(texts[1])];let result;if(v[0]&&v[1])result=texts[0].length>texts[1].length?names[0]+' wins!':texts[1].length>texts[0].length?names[1]+' wins!':'The game is a tie!';else if(v[0]&&!v[1])result=names[0]+' wins with valid English!';else if(!v[0]&&v[1])result=names[1]+' wins with valid English!';else result='No winner: both texts contain invalid English words.';$('#turn').textContent=result;$('#remaining').textContent='100 points used • '+texts[0].length+'–'+texts[1].length;update();return true}function add(choice){if(!roll||left<1||over||pool()<1)return;let t=texts[active];if(choice==='SPACE'){t+='_';picked.push('_')}else{if(t.endsWith('_'))t=t.slice(0,-1)+' ';t+=choice;picked.push(choice)}texts[active]=t;left--;update();finish()}$('#dice').addEventListener('click',()=>{if(roll||over||pool()<1||!started)return;roll=1+Math.floor(Math.random()*6);left=Math.min(roll,pool());picked=[];$('#die').textContent=roll;update()});$('#repeat').addEventListener('click',()=>{if(!picked.length||over)return;texts[active]=texts[active].slice(0,-1);picked.pop();left=Math.min(roll,left+1);update()});$('#done').addEventListener('click',()=>{if(!roll||over)return;if(texts[active].endsWith('_'))texts[active]=texts[active].slice(0,-1)+' ';roll=0;left=0;picked=[];if(finish())return;active=active===0?1:0;$('#die').textContent='–';update()});$('#new').addEventListener('click',()=>{texts=['',''];active=0;roll=0;left=0;picked=[];over=false;started=false;$('#die').textContent='–';$('#setup').style.display='grid';update();setTimeout(()=>$('#name1').focus(),0)});$('#form').addEventListener('submit',e=>{e.preventDefault();const n1=$('#name1').value.trim(),n2=$('#name2').value.trim();if(!n1||!n2){$('#error').textContent='Please enter a name for both players.';return}names=[n1.slice(0,20),n2.slice(0,20)];texts=['',''];active=0;roll=0;left=0;picked=[];over=false;started=true;$('#error').textContent='';$('#die').textContent='–';$('#setup').style.display='none';update()});update();setTimeout(()=>$('#name1').focus(),0)})();
</script>
</div>
